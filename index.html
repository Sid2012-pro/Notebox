<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notebox</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body>
    <div class="toolbar">
        <div class="menu-items">
            <div>File</div>
            <div>Edit</div>
            <div>Window</div>
            <div>Options</div>
        </div>
        <div class="logo">NOTEBOX</div>
    </div>

    <main class="app-container">
        <div class="InstrumentSelector">
        </div>

        <div class="beatMaker">
            <canvas id="beatCanvas"></canvas>
        </div>

        <div class="PianoRoll">
            <canvas id="pianoCanvas"></canvas>
        </div>

        <div class="TrackEditor">
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
